name: Compile PowerShell to EXE & Auto-Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Executables
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install PS2EXE Module
        shell: powershell
        run: |
          Install-Module -Name ps2exe -Force -Scope CurrentUser -AcceptLicense

      - name: Compile AdminWorks.ps1
        shell: powershell
        run: |
          Invoke-ps2exe -inputFile ".\AdminWorks.ps1" -outputFile ".\AdminWorks.exe" -iconFile ".\app.ico" -requireAdmin -noConsole -title "AdminWorks" -company "Kushagra Karira" -version "1.0.0.0"

      - name: Compile AdminWorksPro.ps1
        shell: powershell
        run: |
          Invoke-ps2exe -inputFile ".\AdminWorksPro.ps1" -outputFile ".\AdminWorksPro.exe" -iconFile ".\app.ico" -requireAdmin -noConsole -title "AdminWorks Pro" -company "Kushagra Karira" -version "4.1.0.0"

      - name: Upload EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AdminWorks-Executables
          path: |
            .\AdminWorks.exe
            .\AdminWorksPro.exe
          retention-days: 7

      - name: Auto Release EXEs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AdminWorks Build ${{ github.run_number }}
          body: "Automated build of AdminWorks and AdminWorks Pro executables."
          files: |
            .\AdminWorks.exe
            .\AdminWorksPro.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
