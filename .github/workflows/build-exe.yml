name: Compile PowerShell to EXE & Auto-Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare PowerShell & Install PS2EXE
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name "PSGallery" -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Force -Scope CurrentUser -AcceptLicense -SkipPublisherCheck

      - name: Compile AdminWorks.ps1 to EXE
        id: compile
        shell: powershell
        run: |
          # Synchronize version directly from AdminWorks.ps1
          $scriptContent = Get-Content ".\AdminWorks.ps1" -Raw
          $baseVer = "5.3"
          if ($scriptContent -match 'v(\d+\.\d+)') {
          $baseVer = $matches[1]
          }

          $buildNum = "${{ github.run_number }}"
          $fileVer = "$baseVer.0.$buildNum"
          $tagVer = "v$baseVer.$buildNum"
          $releaseTitle = "AdminWorks Pro v$baseVer (Build $buildNum)"

          Write-Host "Synchronized Version: $baseVer | Tag: $tagVer | PE Version: $fileVer"

          # Export variables to GITHUB_ENV for subsequent steps
          "APP_VERSION=$baseVer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG_NAME=$tagVer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_NAME=$releaseTitle" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $ps2exeParams = @{
              InputFile    = ".\AdminWorks.ps1"
              OutputFile   = ".\AdminWorks.exe"
              NoConsole    = $true
              x64          = $true
              DPIAware     = $true
              SupportOS    = $true
              RequireAdmin = $true
              Title        = "AdminWorks Pro"
              Product      = "AdminWorks Enterprise Suite"
              Description  = "Enterprise Windows Administration & Optimization Suite"
              Company      = "Kushagra Karira"
              Copyright    = "Copyright (c) 2026 Kushagra Karira"
              Version      = $fileVer
          }

          if (Test-Path ".\app.ico") {
              $ps2exeParams["IconFile"] = ".\app.ico"
          }

          Invoke-PS2EXE @ps2exeParams

          if (-not (Test-Path ".\AdminWorks.exe") -or (Get-Item ".\AdminWorks.exe").Length -lt 10000) {
              throw "Compilation failed: AdminWorks.exe is missing or invalid."
          }

          # Generate SHA256 checksum
          $hash = (Get-FileHash -Path ".\AdminWorks.exe" -Algorithm SHA256).Hash
          "$hash  AdminWorks.exe" | Out-File -FilePath ".\AdminWorks.exe.sha256" -Encoding ascii
          Write-Host "Build completed successfully. SHA-256: $hash"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: AdminWorks-Build-${{ github.run_number }}
          path: |
            .\AdminWorks.exe
            .\AdminWorks.exe.sha256
          retention-days: 14

      # Publish GitHub Release using action-gh-release@v3 (Node 24)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ### AdminWorks Enterprise Suite v${{ env.APP_VERSION }} (Build ${{ github.run_number }})
            Automated production build of **AdminWorks Pro**.

            - **Executable**: `AdminWorks.exe`
            - **Software Version**: v${{ env.APP_VERSION }} (Build ${{ github.run_number }})
            - **Architecture**: x64 (Native DPI-aware, Elevated)
            - **Integrity**: Verified with SHA-256 (`AdminWorks.exe.sha256`)
          files: |
            .\AdminWorks.exe
            .\AdminWorks.exe.sha256
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
