name: Compile PowerShell to EXE & Auto-Release

# Trigger the workflow on pushes to main, or manually via the Actions tab
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Grant the workflow permission to write to your repository releases
permissions:
  contents: write

jobs:
  build:
    name: Build and Release Executables
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install PS2EXE Module
        shell: powershell
        run: |
          Install-Module -Name ps2exe -Force -Scope CurrentUser -AcceptLicense

      - name: Compile AdminWorks.ps1
        shell: powershell
        run: |
          Invoke-ps2exe `
            -inputFile ".\AdminWorks.ps1" `
            -outputFile ".\AdminWorks.exe" `
            -noConsole `
            -x64 `
            -dpiAware `
            -supportOS `
            -requireAdmin `
            -iconFile ".\app.ico" `
            -title "AdminWorks Pro" `
            -product "AdminWorks Enterprise Suite" `
            -description "Enterprise Windows Administration & Optimization Suite" `
            -company "Kushagra Karira" `
            -copyright "Copyright (c) 2026 Kushagra Karira" `
            -originalFilename "AdminWorks.exe" `
            -version "5.0.0.0"

      - name: Upload EXE Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: AdminWorks-Executables
          path: .\AdminWorks.exe
          retention-days: 7

      # Automatically create a GitHub Release and attach the compiled EXE
      - name: Auto Release EXEs
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: AdminWorks Build ${{ github.run_number }}
          body: "Automated build of the AdminWorks executable."
          files: .\AdminWorks.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
