name: Compile PowerShell to EXE & Auto-Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install PS2EXE Module
        shell: powershell
        run: |
          Install-Module -Name ps2exe -Force -Scope CurrentUser -AcceptLicense

      # Using the direct argument syntax to bypass module parsing bugs
      - name: Compile AdminWorks.ps1
        shell: powershell
        run: |
          ps2exe .\AdminWorks.ps1 .\AdminWorks.exe -noConsole -requireAdmin

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdminWorks-Executable
          path: .\AdminWorks.exe
          retention-days: 7

      - name: Auto Release EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AdminWorks Build ${{ github.run_number }}
          body: "Automated build of the AdminWorks executable."
          files: .\AdminWorks.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
